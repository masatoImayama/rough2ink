[project]
name = "rough2ink"
version = "0.1.0"
description = "漫画原稿 前処理検証ツール（Phase 0 素材検証）PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "scipy>=1.14",
    "pillow>=10.4",
    "psd-tools>=1.9",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rough2ink"]
