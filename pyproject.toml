[project]
name = "rough2ink"
version = "0.1.0"
description = "漫画原稿 前処理検証ツール（Phase 0 素材検証）PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "scipy>=1.14",
    "pillow>=10.4",
    "psd-tools>=1.9",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # メモリ回帰テスト用。`resource` は POSIX 専用で Windows ではテストがスキップされ、
    # 「Windows ローカルで動くこと」という第一要件の検証が抜けてしまうため使わない。
    # `tracemalloc` は Python のアロケータ経由の確保しか追跡できず、NumPy の大きな配列は
    # malloc を直接呼ぶため捕捉できない（このテストが測りたいのはまさにそれ）。
    "psutil>=5.9",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "httpx>=0.27",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rough2ink"]
